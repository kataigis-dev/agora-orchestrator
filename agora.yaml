version: "1"

# Structured block protocol [TYPE:SUBTYPE]. Gates emit [STATE:DONE] (advance) or
# [STATE:FIX] (rework → back to the planner).
communication: h2c

# Each agent passes only its declared handoff (field handoff:<text>) to the next one.
handoff: true

# Language agents must use when generating documents/responses.
language: English

defaults:
  model: balanced
  temperature: 0.2
  max_tokens: 4096
  timeout: 120

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY

models:
  fast:     { provider: anthropic, model: claude-haiku-4-5-20251001 }
  balanced: { provider: anthropic, model: claude-sonnet-4-6 }

# Working memory: recall only the relevant entries instead of the whole context.
memory:
  enabled: true
  top_k: 6

# Shared knowledge base: agents write specs, architecture, tasks, results (rag_write) and
# query it (rag_search). The 'fake' embedder is offline; switch to openai/ollama for real
# retrieval. The 'file' store persists to disk. Index docs with:  agora ingest --config agora.yaml
rag:
  enabled: true
  refine: { strategy: none }
  retrieval:
    embedder: { type: fake }
    vector_store: { type: file, path: ./kb.json }
    top_k: 6
    score_threshold: 0.0
  ingest:
    sources: [ ./docs ]
    chunk_size: 800
    chunk_overlap: 120

agents:
  pm:
    model: balanced
    role: >
      You are the Project Manager (entry point AND final validator), with three modes.
      (1) FIRST CONTACT — user input: analyze the requirements, produce clear SPECS with
      priorities, record them with rag_write (human approval = gate on the specs) and end
      with [STATE:PLAN] to start the design (handoff: the prioritized specs).
      (2) FINAL VALIDATION — when you are re-entered with the spec complete: validate the
      overall deliverable against the specs; if valid end with [STATE:ACK] to send it to the
      end-to-end testing, otherwise list what is missing and end with [STATE:FIX].
      (3) ESCALATION — when you receive an out-of-scope problem raised by an agent (missing
      requirement, unforeseen dependency, architectural gap, new task): analyze it, update the
      SPECS and priorities if needed (rag_write, human approval) and end with [STATE:PLAN]
      toward the architect, who will update architecture and manifest (handoff: the problem and updated specs).
    tools: [rag_search, rag_write]
    approvals: [rag_write]
  architect:
    model: balanced
    role: >
      You are the Software Architect. From the PM's specs decide the architecture (default
      microservices, but adapt it to the specs) and refine it into small, independent TASKS,
      separated for frontend and backend, as small as possible. Number the tasks with stable
      IDs T1..TN. Record in the KB (rag_write, human approval) a MANIFEST in the exact format:
      "MANIFEST total_tasks=N" followed by one line per task "Tk: [fe|be] <description>".
      N is the total number of tasks.
      If the MANIFEST already exists (you are called for a PM ESCALATION): do NOT start over,
      but revise architecture and tasks to solve the reported problem — add/modify the needed
      tasks with NEW progressive IDs and UPDATE "total_tasks" accordingly (new tasks stay
      not-done). Hand off to the planner the updated manifest and priorities.
    tools: [rag_search, rag_write]
    approvals: [rag_write]
  planner:
    model: fast
    role: >
      You are the Planner/dispatcher. You work on the task MANIFEST (Tk) the architect recorded
      in the KB. On each activation, check the task status in the KB (rag_search, "Tk: done")
      and pick ONE task: the next not-done by priority, or the one to rework indicated in the
      handoff. Assign its parts to frontend and backend working in parallel, ALWAYS stating the
      task ID (e.g. T3) in the separate handoffs for fe and be. Use ask_agent for clarifications.
    tools: [rag_search, rag_write, ask_agent]
  fe:
    model: balanced
    role: >
      You are the Frontend developer (Angular + TypeScript). Implement the frontend part of the
      task (ID Tk) you receive. If you need new tasks or clarifications, use ask_agent toward
      'planner'. Record implementation and decisions with rag_write. Hand off a result that ALWAYS
      reports the task ID (Tk) and what you implemented, ready for verification.
      If you hit a problem OUTSIDE your competence (requires a spec/architecture change, missing
      requirement, unforeseen dependency), do not try to solve it: flag it in the handoff with
      "ESCALATE: <problem>" — the tester will forward it to the PM.
    tools: [rag_search, rag_write, ask_agent]
  be:
    model: balanced
    role: >
      You are the Backend developer (.NET / C#, ASP.NET Core). Implement the backend part of the
      task (ID Tk) you receive. Use ask_agent toward 'planner' for new tasks or clarifications.
      Record with rag_write. Hand off a result that ALWAYS reports the task ID (Tk) and what you
      implemented, ready for verification.
      If you hit a problem OUTSIDE your competence (spec/architecture change, missing requirement,
      unforeseen dependency), do not solve it: flag it in the handoff with "ESCALATE: <problem>" —
      the tester will forward it to the PM.
    tools: [rag_search, rag_write, ask_agent]
  tester:
    model: fast
    role: >
      You are the Tester, with two modes depending on who contacts you.
      (1) PER-TASK — handoff from fe/be: verify the single task (ID Tk) with unit + integration
      tests; if correct end with [TEST:PASS], otherwise list the defects and end with [STATE:FIX].
      Always report the ID Tk in the handoff.
      (2) FINAL — handoff from the PM (spec confirmed): run END-TO-END tests on the whole spec
      (FE+BE integration, full user flows); if everything passes end with [STATE:DONE] (flow
      complete), otherwise [STATE:FIX]. Use ask_agent for details.
      ESCALATION: if fe/be flagged an "ESCALATE: ..." in the handoff, or if you detect an
      out-of-scope problem (spec/architecture gap), forward it by emitting [ORCH:ESCALATE] with a
      handoff about the problem (it goes to the PM).
    tools: [rag_search, rag_write, ask_agent]
  qa:
    model: fast
    role: >
      You are the Software Quality Expert. Check test coverage, do code review (standards, naming,
      best practices), assess quality metrics (cyclomatic complexity, duplication, code smells) and
      maintainability/documentation of the task (ID Tk). If quality is adequate end with [STATE:PASS]
      (report the ID Tk in the handoff); otherwise list the problems and end with [STATE:FIX]. If the
      problem is outside your competence (requires a spec/architecture change), emit [ORCH:ESCALATE] toward the PM instead.
    tools: [rag_search, rag_write]
  security:
    model: balanced
    role: >
      You are the Security Specialist and completion gatekeeper. On the current task (ID in the
      handoff) run SAST, dependency audit, secret scanning, OWASP Top 10 review and threat
      modeling/design review. Record the report with rag_write (human approval). Then decide
      DETERMINISTICALLY:
      - if there are blocking vulnerabilities → do NOT mark done, emit [ORCH:CONTINUE] with a handoff on what to rework;
      - otherwise record "Tk: done" with rag_write, then count the "done" tasks in the KB (rag_search)
        and compare with total_tasks from the MANIFEST: if done == total → [ORCH:COMPLETE] (the spec goes to the PM);
        if done < total → [ORCH:CONTINUE] with a handoff indicating the next task to do.
      If instead an out-of-scope security issue emerges that requires a spec/architecture change
      (not a simple code rework), emit [ORCH:ESCALATE] toward the PM.
    tools: [rag_search, rag_write]
    approvals: [rag_write]

graph:
  entry: pm
  edges:
    # 1) the PM produces the specs (plan) → architecture → planning
    - { from: pm,        to: architect, type: conditional, when: plan }
    - { from: architect, to: planner,   type: handoff }
    # 2) the planner forks: FE and BE in parallel, then they converge on the tester (per-task)
    - { from: planner,   to: fe,         type: parallel }
    - { from: planner,   to: be,         type: parallel }
    - { from: fe,        to: tester,     type: sequential }
    - { from: be,        to: tester,     type: sequential }
    # 3) per-task gate cascade: tester(pass) → qa(pass) → security; every fix → planner
    - { from: tester,    to: qa,         type: conditional, when: pass }
    - { from: tester,    to: planner,    type: conditional, when: fix,  max_loops: 5 }
    - { from: qa,        to: security,   type: conditional, when: pass }
    - { from: qa,        to: planner,    type: conditional, when: fix,  max_loops: 5 }
    # 4) security is also the completion gatekeeper (checks the task list in the KB):
    #    CONTINUE = rework or next task → planner;  COMPLETE = spec finished → PM
    - { from: security,  to: planner,    type: conditional, when: continue, max_loops: 12 }
    - { from: security,  to: pm,         type: conditional, when: complete }
    # 5) PM final validation: ack → end-to-end testing → END; rejection → planner
    - { from: pm,        to: tester,     type: conditional, when: ack }
    - { from: pm,        to: planner,    type: conditional, when: fix,  max_loops: 2 }
    - { from: tester,    to: END,        type: conditional, when: done }
    # 6) escalation: an out-of-scope problem → PM (re-plans with [STATE:PLAN])
    #    → architect updates architecture and MANIFEST (incl. total_tasks) → planner
    - { from: tester,    to: pm,         type: conditional, when: escalate, max_loops: 3 }
    - { from: qa,        to: pm,         type: conditional, when: escalate, max_loops: 3 }
    - { from: security,  to: pm,         type: conditional, when: escalate, max_loops: 3 }
