version: "1"
communication: natural

defaults: { model: balanced, temperature: 0.2 }

providers:
  openai: { api_key_env: OPENAI_API_KEY }

models:
  balanced: { provider: openai, model: gpt-4o }

# Structured spec-driven development. The spec is a machine-checkable artifact (requirements with
# stable ids + acceptance criteria, and tasks that trace back to them), not free text. By default it
# is persisted as canonical JSON next to this config (spec.json), the deterministic source of truth.
spec:
  enabled: true
  require_criteria: true            # every requirement must carry at least one acceptance criterion
  store:
    type: file                      # deterministic JSON source of truth
    path: ./spec.json
    # --- RAG over MCP variant (durable / shareable spec): point at an MCP server that exposes a
    # --- write tool and a read/search tool, then switch `type` to mcp.
    # type: mcp
    # server: memory                # references mcp.servers.memory below
    # write_tool: rag_write
    # read_tool: rag_search
    # write_arg: text               # argument carrying the payload on the write tool
    # query_arg: query              # argument carrying the lookup key on the read tool
    # key: "agora:spec-document"

# mcp:
#   servers:
#     memory:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-memory"]

# Real build/test execution: a fixed allow-list of named commands. Agents can only run these by
# name (never a raw command line), and they execute with no shell, so arguments can't inject shell
# syntax. spec_verify runs the check bound to each acceptance criterion and trusts the exit code.
checks:
  workdir: .
  timeout: 300
  commands:
    build: { command: dotnet, args: [build] }
    test:  { command: dotnet, args: [test, --filter, "{filter}"] }

agents:
  pm:
    model: balanced
    role: "Product manager: turn the request into structured requirements with acceptance criteria."
    system_prompt: |
      Use spec_propose_requirement to record each requirement (priority must/should/could/wont and
      one acceptance criterion per line). Then set status with spec_set_status. When done, signal
      <<signal specced>>.
    tools: [spec_get, spec_propose_requirement, spec_set_status]

  architect:
    model: balanced
    role: "Architect: plan tasks and bind acceptance criteria to runnable checks."
    system_prompt: |
      Read the spec with spec_get. For each approved requirement add tasks with spec_add_task
      (linking the requirement ids it implements), and bind each acceptance criterion to a check with
      spec_bind_check (kind command/test, expression is the configured check name — e.g. "build", or
      "test filter=AuthTests"). When every approved requirement is covered and checkable, signal
      <<signal planned>>.
    tools: [spec_get, spec_add_task, spec_link_task, spec_bind_check]

  qa:
    model: balanced
    role: "QA: verify each requirement by running its bound checks; never claim success without them."
    system_prompt: |
      For each requirement, call spec_verify to run its bound checks. spec_verify marks a requirement
      Verified only when the checks pass deterministically. You may also call run_check directly to
      diagnose a failure. Then call spec_gate: it deterministically reports whether every approved
      requirement is covered and verified. Only signal <<signal verified>> when spec_gate reports
      COMPLETE; otherwise report the gaps it lists and signal <<signal fix>>.
    tools: [spec_get, run_check, spec_verify, spec_gate]

graph:
  entry: pm
  edges:
    - { from: pm, to: architect, type: conditional, when: specced }
    - { from: architect, to: qa, type: conditional, when: planned }
    - { from: qa, to: END, type: conditional, when: verified }
    - { from: qa, to: architect, type: conditional, when: fix, max_loops: 3 }
