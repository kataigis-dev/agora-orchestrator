version: "1"
communication: natural
defaults: { model: local, temperature: 0.5, max_tokens: 4096, timeout: 120 }
providers:
  llamastudio:
    base_url: http://127.0.0.1:1234/v1
    api_key_env: ~
models:
  local: { provider: llamastudio, model: google/gemma-4-e4b }
agents:
  assistant:
    model: local
    role: "You are a helpful AI assistant."
    system_prompt: "You are a helpful AI assistant. Answer concisely and accurately."
