version: "1"

defaults: { model: balanced, timeout: 120 }

providers:
  openai: { api_key_env: OPENAI_API_KEY }

models:
  fast:     { provider: openai, model: gpt-4o-mini }
  balanced: { provider: openai, model: gpt-4o }

# Folders to search for skills (SKILL.md files, recursive search).
skills:
  directories: [./skills]

# Available MCP servers. Tools are exposed to agents that list them in `tools`.
# Started via stdio (a child process) or via HTTP (the `url` field).
mcp:
  servers:
    filesystem:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

agents:
  # Tool-capable agent: uses the `summarize` skill (progressive disclosure via load_skill)
  # and the MCP tool `read_file` exposed by the filesystem server.
  researcher:
    model: balanced
    role: "Answer the user's questions. Summarize long texts and read files when needed."
    skills: [summarize]
    tools: [read_file]
  # Tool-less agent: stays on the framework-free core.
  editor:
    model: fast
    role: "Refine the researcher's answer: clarity, tone, grammar."

graph:
  entry: researcher
  edges:
    - { from: researcher, to: editor, type: handoff }
    - { from: editor,     to: END,    type: sequential }
